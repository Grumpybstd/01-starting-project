<div class="login-container">
  @if (!isLoading) {
  <form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)">
    <h2>Member & Committee Area</h2>
    <br />
    <h2>ID and Password to Login</h2>
    <div class="control">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        ngModel
        required
        email
        #email="ngModel"
      />
    </div>

    <div class="control-row">
      <div class="control">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          ngModel
          required
          minlength="6"
          #password="ngModel"
        />
      </div>

      <div class="control">
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" name="confirm-password" />
      </div>
    </div>
    <p class="form-actions">
      <button type="reset" class="button button-flat">Reset</button>
      <button type="button" class="button" (click)="onSwitchMode()">
        Switch to {{ isloginMode ? "Sign Up" : "Login" }}
      </button>
      <button class="button" type="submit" [disabled]="!authForm.valid">
        {{ isloginMode ? "Login" : "Sign Up" }}
      </button>
    </p>
    @if(responseErrorMsg){
    <div class="alert alert-danger">
      <p>{{ responseErrorMsg }}</p>
    </div>
    }
    <!-- @if(email.touched && email.dirty && email.invalid){
    <p>Invalid email address entered.</p>
    } 
    @if(password.touched && password.dirty && password.invalid){
    <p>Invalid password entered - at least 6 characters in length</p>
    } -->
  </form>

  }@else{
  <div>
    <app-loading-spinner></app-loading-spinner>
  </div>
  }
</div>
