<div class="weatherContainer">
  <iframe
    class="met1"
    style="border: 0px #ccc solid"
    src="https://www.met.ie/widgets/observations/"
    name="MEWarning"
    frameborder="0"
    marginwidth="0px"
    marginheight="0px"
    scrolling="no"
    allowfullscreen="allowfullscreen"
    title="weather station observations widget"
  ></iframe>

  <iframe
    style="border: 1px #ccc solid"
    src="https://www.met.ie/widgets/national"
    name="MEWarning"
    frameborder="1"
    marginwidth="0px"
    marginheight="0px"
    scrolling="no"
    allowfullscreen="allowfullscreen"
    title="Weather warnings widget"
  ></iframe>
</div>
